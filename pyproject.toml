[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slippagetwinai"
version = "0.1.0"
description = "Leakage-resistant empirical execution-cost twin"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
slippagetwinai = "slippagetwinai.cli:main"

[tool.setuptools.package-data]
slippagetwinai = ["data/*.csv", "data/*.json"]
